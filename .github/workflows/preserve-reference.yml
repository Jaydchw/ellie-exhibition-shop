name: Preserve public pricing reference

on:
  push:
    branches: [main]
    paths: ['.github/native-shop-reference.json.gz']

permissions:
  contents: write

jobs:
  restore-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Restore exact public supplier pricing reference
        shell: bash
        run: |
          gzip -dc .github/native-shop-reference.json.gz > setup/prodigi-supplier-rates.json
          actual=$(git hash-object setup/prodigi-supplier-rates.json)
          test "$actual" = "c812f36cdf8879e300cca95eb540499c34f89b41"
          git add -- setup/prodigi-supplier-rates.json
          git rm -- .github/native-shop-reference.json.gz .github/workflows/preserve-reference.yml
          git -c user.name='github-actions[bot]' -c user.email='github-actions[bot]@users.noreply.github.com' commit -m 'Preserve public supplier pricing reference'
          git push origin HEAD:main
